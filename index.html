<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dash DFU Trigger</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 30px; background: #222; color: #fff; }
        button { padding: 15px 30px; font-size: 18px; border-radius: 8px; border: none; background: #008cba; color: white; cursor: pointer; width: 100%; max-width: 300px; }
        button:hover { background: #005f73; }
        #log { margin-top: 20px; white-space: pre-wrap; color: #00ffcc; text-align: left; background: #111; padding: 15px; border-radius: 5px; font-size: 14px; max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body>

    <h2>Công cụ ép DFU cho Robot Dash</h2>
    <p>Nhấn nút bên dưới để quét, tự động tìm cổng Ghi và gửi lệnh sang Dash</p>
    <br>
    <button onclick="sendDFUCommand()">Kết Nối & Ép DFU</button>

    <div id="log">Sẵn sàng...</div>

    <script>
        function log(msg) {
            const logDiv = document.getElementById('log');
            logDiv.innerText += "\n" + msg;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(msg);
        }

        async function sendDFUCommand() {
            try {
                log("Đang tìm kiếm thiết bị Bluetooth...");
                
                // Mở bảng quét Bluetooth của trình duyệt (không lọc service để thấy hết thiết bị)
                const device = await navigator.bluetooth.requestDevice({
                    filters: [
                        { namePrefix: 'Dash' },
                        { namePrefix: 'DAnna' }
                    ],
                    optionalServices: [] 
                });

                log("Đã chọn robot: " + device.name);
                log("Đang kết nối GATT Server...");
                const server = await device.gatt.connect();

                log("Đang lấy danh sách tất cả các Service...");
                const services = await server.getPrimaryServices();
                
                let targetCharacteristic = null;

                // Tự động quét qua tất cả các service và characteristic để tìm cổng ghi dữ liệu
                for (const service of services) {
                    const characteristics = await service.getCharacteristics();
                    for (const char of characteristics) {
                        if (char.properties.write || char.properties.writeWithoutResponse) {
                            targetCharacteristic = char;
                            log("Đã tìm thấy cổng Ghi (Characteristic): " + char.uuid);
                            break;
                        }
                    }
                    if (targetCharacteristic) break;
                }

                if (!targetCharacteristic) {
                    throw new Error("Không tìm thấy cổng truyền dữ liệu (Characteristic) phù hợp!");
                }

                log("Đang gửi lệnh kích hoạt DFU...");
                const dfuCommand = new Uint8Array([0x03, 0xFF, 0x01, 0x00]); 
                await targetCharacteristic.writeValue(dfuCommand);
